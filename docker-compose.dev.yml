# Development overlay — adds live reload to the API.
# Merges with docker-compose.yml; do not use standalone.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   make dev   (shorthand)

services:
  app:
    command: uv run uvicorn app:app --reload --host 0.0.0.0 --port 8000
    volumes:
      # Mount source directories individually so the .venv installed inside
      # the image is not hidden by a top-level bind mount.
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./database.py:/app/database.py
      - ./models:/app/models
      - ./routers:/app/routers
      - ./services:/app/services
      - ./repositories:/app/repositories
